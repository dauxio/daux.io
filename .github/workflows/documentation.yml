name: Documentation

on:
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to gh-pages
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: 8.4
        extensions: mbstring, dom, intl, iconv
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-suggest
    - name: Generate documentation
      run: bin/daux generate --value html.plausible_domain=daux.io
    - name: Deploy same repository 🚀
      uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
      with:
        folder: "static"
        branch: gh-pages
    - name: Deploy daux.io 🚀
      uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
      with:
        folder: "static"
        token: ${{ secrets.GH_TOKEN_DAUX }}
        branch: master
        repository-name: dauxio/dauxio.github.io

